[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "belljar"
version = "2.0.0"
description = "Automatic alignment tool for mouse brain histology"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Alec Soronow" }]
dependencies = [
    "brainglobe-atlasapi>=2.0",
    "matplotlib",
    "numpy<2.0.0",
    "opencv-python",
    "Pillow",
    "pydantic>=2.0",
    "scikit-learn",
    "scipy",
    "imagecodecs",
    "scikit-image",
    "tifffile",
    "torch",
    "torchvision",
    "ultralytics",
    "sahi>=0.11.0",
    "pyqt6",
    "napari",
    "SimpleITK",
    "pytorch-msssim",
    "timm",
    "segment-anything-py",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "pyright",
]
datagen = [
    "brainglobe-atlasapi>=2.0",
    "numpy<2.0.0",
    "opencv-python-headless",
    "Pillow",
    "pydantic>=2.0",
    "scipy",
    "SimpleITK",
    "tifffile",
]
train = [
    "wandb",
    "tensorboard",
]

[project.scripts]
belljar = "belljar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/belljar"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # type-checking imports
]

[tool.ruff.lint.isort]
known-first-party = ["belljar"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
