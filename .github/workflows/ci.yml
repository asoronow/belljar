name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  QT_QPA_PLATFORM: offscreen

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      # tk/nrrd let the v1 script parser tests import collate, map and adjust instead of
      # skipping; the GL/Qt libraries let napari and PyQt6 import under the offscreen platform.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-tk libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install CPU torch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install package
        run: |
          pip install -e ".[dev,train]"
          pip install pynrrd

      - name: Check legacy test dependencies are importable
        run: python -c "import tkinter, nrrd"

      - name: Ruff
        run: ruff check src tests scripts

      - name: Pyright
        run: pyright src

      - name: Pytest
        run: python -m pytest tests -q

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Compiled output matches sources
        run: git diff --exit-code -- main.js launch.js __tests__
